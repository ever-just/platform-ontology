<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Platform Ontology Voice</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; color: #111; font: 15px/1.5 system-ui, -apple-system, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; box-sizing: border-box; }
      button { font: inherit; font-size: 17px; padding: 14px 34px; border-radius: 999px; border: 1px solid #111; background: #111; color: #fff; cursor: pointer; }
      button.on { background: #fff; color: #111; }
      button:disabled { opacity: .5; cursor: default; }
      #status { min-height: 1.5em; color: #666; text-align: center; max-width: 34em; }
      #feed { width: 100%; max-width: 38em; max-height: 50vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
      #feed:empty { display: none; }
      #feed p { margin: 0; padding: 8px 12px; border-radius: 12px; max-width: 85%; overflow-wrap: anywhere; }
      #feed .you { align-self: flex-end; background: #f1f1f1; }
      #feed .ai { align-self: flex-start; border: 1px solid #e3e3e3; }
      #feed .step { align-self: center; font-size: 12px; color: #777; padding: 2px 8px; }
      #feed .step::before { content: "\2026 "; }
      #feed .step.ok::before { content: "\2713 "; }
      #feed .step.bad::before { content: "\2715 "; color: #b00; }
      @media (prefers-color-scheme: dark) {
        html, body { background: #111; color: #eee; }
        button { background: #eee; color: #111; border-color: #eee; }
        button.on { background: #111; color: #eee; }
        #feed .you { background: #262626; }
        #feed .ai { border-color: #333; }
      }
    </style>
  </head>
  <body>
    <main>
      <button id="go">Start</button>
      <div id="status"></div>
      <div id="feed" aria-live="polite"></div>
    </main>
    <script type="module" src="/src/ai/main.ts"></script>
  </body>
</html>
